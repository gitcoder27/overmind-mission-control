name: Production Readiness

on:
  push:
  pull_request:

jobs:
  readiness:
    name: Lint, tests, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax checks
        run: |
          bash -n dev-stack.sh
          bash -n scripts/dev-doctor.sh
          bash -n scripts/smoke-dev-stack.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint + tests
        working-directory: frontend
        run: |
          npm run lint
          npm run test:run

      - name: Run dev doctor and smoke
        env:
          SMOKE_LIVE: "1"
        run: |
          ./scripts/dev-doctor.sh
          ./scripts/smoke-dev-stack.sh
